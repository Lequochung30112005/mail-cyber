server {
    listen 80;

    # DNS mặc định của Docker để phân giải tên service 'backend'
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls đến backend - SỬA LẠI ĐỂ CHỐNG CRASH
    location /api/ {
        # Dùng biến để Nginx không kiểm tra host lúc startup
        set $target http://backend:8000;

        # Lưu ý: Nếu backend của ông viết API dạng /auth/login
        # mà ở đây proxy từ /api/ sang, hãy cẩn thận dấu gạch chéo (/)
        proxy_pass $target;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài chút để AI xử lý không bị 504
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}